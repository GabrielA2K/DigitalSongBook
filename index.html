<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Digital Songbook for SongHub</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#07090e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Songbook">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse CDN for CSV Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.4.1/papaparse.min.js"></script>
    
    <!-- FontAwesome 6 CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter & Cinzel for Vintage Music Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#fef9c3',
                            200: '#fef08a',
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            700: '#a16207',
                            800: '#854d0e',
                            900: '#713f12',
                        },
                        stage: {
                            950: '#07090e',
                            900: '#0f131d',
                            800: '#181e2b',
                            700: '#232b3d',
                            600: '#323d54',
                            500: '#465473',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar for songbook binder */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f131d;
        }
        ::-webkit-scrollbar-thumb {
            background: #232b3d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ca8a04;
        }

        /* Hide scrollbars for clean touch horizontal scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Tap highlight prevention for smooth native touch feel */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* Gold gradient typography & glow effects */
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #a16207 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border-glow {
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.15);
        }
        .gold-border-glow:hover {
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.3);
        }

        /* Vinyl Record Rotation Animation */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 20s linear infinite;
        }

        /* ===== iOS safe areas (notch, Dynamic Island, home indicator) ===== */
        html {
            background: #07090e;               /* matches status bar / overscroll */
            -webkit-text-size-adjust: 100%;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;                 /* iOS Safari: 100vh ignores the toolbar */
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        /* Sticky header: sits below the status bar / notch, still spans full width */
        header.sticky {
            padding-top: env(safe-area-inset-top, 0px);
            margin-left: calc(env(safe-area-inset-left, 0px) * -1);
            margin-right: calc(env(safe-area-inset-right, 0px) * -1);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        /* Modals: keep content clear of notch + home indicator */
        #uploadModal, #songDetailModal {
            padding-top: max(0.75rem, env(safe-area-inset-top, 0px));
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
            padding-left: max(0.75rem, env(safe-area-inset-left, 0px));
            padding-right: max(0.75rem, env(safe-area-inset-right, 0px));
        }
        #uploadModal > div, #songDetailModal > div {
            max-height: 90vh;
            max-height: calc(100dvh - 1.5rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        }
        /* Toasts above the home indicator */
        #toastContainer {
            bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
            right: calc(1.25rem + env(safe-area-inset-right, 0px));
        }
        /* iOS zooms the page when focusing inputs under 16px */
        @supports (-webkit-touch-callout: none) {
            input, textarea, select { font-size: 16px !important; }
        }

        /* Print Media Styles for physical songbook export */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .song-card-print {
                break-inside: avoid;
                border: 1px solid #ddd !important;
                background: white !important;
                color: black !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-stage-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-gold-500 selection:text-slate-950">

    <header class="no-print border-b border-stage-700/80 bg-stage-900/90 backdrop-blur-md sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-2 sm:gap-4">
            
            <!-- Logo & Brand Header -->
            <div class="flex items-center space-x-2 sm:space-x-3 cursor-pointer min-w-0" onclick="resetAllFilters()">
                <div class="relative w-9 h-9 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-gold-300 via-gold-500 to-amber-800 p-0.5 shadow-lg gold-border-glow flex-shrink-0">
                    <div class="w-full h-full bg-stage-950 rounded-[10px] flex items-center justify-center relative overflow-hidden">
                        <i class="fa-solid fa-record-vinyl text-gold-400 text-lg sm:text-2xl animate-spin-slow"></i>
                    </div>
                </div>
                <div class="truncate">
                    <h1 class="text-base sm:text-2xl font-serif font-black tracking-wider gold-gradient-text uppercase leading-none">Songbook</h1>
                    <p class="text-[9px] sm:text-[11px] text-slate-400 font-mono tracking-wider sm:tracking-widest uppercase mt-0.5 truncate">For SongHub (Old ver.)</p>
                </div>
            </div>

            <!-- Header Quick Controls -->
            <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
                <!-- Favorites Filter Button -->
                <button id="favsToggleBtn" onclick="toggleFavoritesOnly()" class="px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl bg-stage-800 hover:bg-stage-700 text-xs sm:text-sm font-semibold border border-stage-700/80 flex items-center space-x-1.5 sm:space-x-2 transition text-slate-300">
                    <i class="fa-solid fa-star text-amber-400 text-xs sm:text-sm"></i>
                    <span class="hidden md:inline">Favorites</span>
                    <span id="favsCountBadge" class="bg-amber-500/20 text-amber-400 text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded-full font-mono font-bold">0</span>
                </button>

                <!-- Load Sample Demo Songs -->
                <button onclick="restoreDefaultDemoSongs()" class="px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl bg-gradient-to-r from-amber-600 via-gold-600 to-gold-500 hover:from-amber-500 hover:to-gold-400 text-slate-950 font-bold text-xs sm:text-sm flex items-center space-x-1 sm:space-x-1.5 shadow-md shadow-amber-950/40 transition">
                    <i class="fa-solid fa-music text-xs sm:text-sm"></i>
                    <span class="hidden sm:inline">Default Songs</span>
                </button>

                <!-- CSV Import Modal Button -->
                <button onclick="openUploadModal()" class="px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl bg-stage-800 hover:bg-stage-700 text-gold-400 hover:text-gold-300 font-semibold text-xs sm:text-sm flex items-center space-x-1 sm:space-x-1.5 border border-gold-500/30 transition">
                    <i class="fa-solid fa-file-csv text-sm sm:text-base"></i>
                    <span class="hidden xs:inline sm:inline">CSV</span>
                </button>

                <!-- Print Songbook Trigger -->
                <button onclick="window.print()" class="p-1.5 sm:p-2 rounded-xl bg-stage-800 hover:bg-stage-700 text-slate-300 hover:text-white border border-stage-700 transition" title="Print Songbook">
                    <i class="fa-solid fa-print text-xs sm:text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 flex-grow w-full space-y-4 sm:space-y-6">

        <!-- Top Banner / Songbook Stats Card -->
        <div class="no-print bg-gradient-to-r from-stage-900 via-stage-800 to-stage-900 rounded-2xl border border-stage-700/80 p-4 sm:p-6 shadow-2xl relative overflow-hidden">
            <!-- Vintage Mic Watermark -->
            <div class="absolute -right-6 -bottom-8 opacity-5 pointer-events-none text-gold-400">
                <i class="fa-solid fa-microphone-lines text-[120px] sm:text-[180px]"></i>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 relative z-10">
                <div class="space-y-1">
                    <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                        <span id="catalogTitle" class="text-lg sm:text-2xl font-serif font-bold text-white">SongHub Songbook</span>
                        <span id="sourceBadge" class="text-[10px] sm:text-xs bg-gold-500/20 text-gold-400 border border-gold-500/30 px-2 sm:px-2.5 py-0.5 rounded-full font-semibold">Default Songs Loaded</span>
                    </div>
                    <!-- <p class="text-[11px] sm:text-sm text-slate-400">All song numbers are formatted to <b>5 digits (e.g. 00001, 00452)</b>. Search works with both <b>padded ('00045')</b> or <b>plain numbers ('45')</b>.</p> -->
                </div>

                <!-- Song Count Badges -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="flex-1 sm:flex-initial bg-stage-950/80 border border-stage-700/80 rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 text-center min-w-[90px] sm:min-w-[110px]">
                        <span class="block text-[9px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">Total Songs</span>
                        <span id="statTotalSongs" class="text-lg sm:text-xl font-mono font-bold text-gold-400">0</span>
                    </div>
                    <div class="flex-1 sm:flex-initial bg-stage-950/80 border border-stage-700/80 rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 text-center min-w-[90px] sm:min-w-[110px]">
                        <span class="block text-[9px] sm:text-[10px] uppercase tracking-wider text-slate-400 font-bold">Matching</span>
                        <span id="statFilteredSongs" class="text-lg sm:text-xl font-mono font-bold text-slate-100">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="no-print bg-stage-900/90 backdrop-blur-md rounded-2xl border border-stage-700/80 p-3.5 sm:p-5 space-y-3 sm:space-y-4 shadow-xl">
            
            <!-- Real-time Search Bar & Scope Filters -->
            <div class="flex flex-col lg:flex-row gap-3 sm:gap-4 items-stretch lg:items-center justify-between">
                
                <!-- Main Search Input -->
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-sm sm:text-base"></i>
                    </div>
                    <input type="text" id="searchInput" oninput="handleSearchChange()" placeholder="Search title, artist, or song number (e.g., '00042' or '42')..." class="w-full pl-10 pr-10 py-2.5 sm:py-3 bg-stage-950 border border-stage-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-gold-500 focus:ring-1 focus:ring-gold-500 transition text-sm sm:text-base font-medium">
                    <button id="clearSearchBtn" onclick="clearSearchInput()" class="hidden absolute inset-y-0 right-0 pr-2 flex items-center text-slate-400 hover:text-white transition p-2">
                        <i class="fa-solid fa-circle-xmark text-sm sm:text-base"></i>
                    </button>
                </div>

                <!-- Scope Filter Buttons -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 lg:pb-0 font-medium text-xs -mx-1 px-1">
                    <span class="text-slate-400 mr-1 hidden sm:inline flex-shrink-0">Scope:</span>
                    <button onclick="setSearchScope('all')" id="scope-all" class="scope-btn px-3 py-2 rounded-lg bg-gold-500 text-slate-950 font-bold transition shadow-sm flex-shrink-0">All</button>
                    <button onclick="setSearchScope('title')" id="scope-title" class="scope-btn px-3 py-2 rounded-lg bg-stage-950 text-slate-300 hover:bg-stage-800 border border-stage-700 transition flex-shrink-0">Title</button>
                    <button onclick="setSearchScope('artist')" id="scope-artist" class="scope-btn px-3 py-2 rounded-lg bg-stage-950 text-slate-300 hover:bg-stage-800 border border-stage-700 transition flex-shrink-0">Artist</button>
                    <button onclick="setSearchScope('number')" id="scope-number" class="scope-btn px-3 py-2 rounded-lg bg-stage-950 text-slate-300 hover:bg-stage-800 border border-stage-700 transition flex-shrink-0">Song #</button>
                </div>
            </div>

            <!-- Sorting & View Modes Bar -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2.5 sm:pt-3 border-t border-stage-700/60 text-xs sm:text-sm">
                
                <!-- Sort Dropdown -->
                <div class="flex items-center space-x-2 flex-grow sm:flex-grow-0">
                    <label for="sortOption" class="text-slate-400 font-semibold whitespace-nowrap"><i class="fa-solid fa-arrow-down-short-wide text-gold-400 mr-1"></i>Sort:</label>
                    <select id="sortOption" onchange="handleSortChange()" class="w-full sm:w-auto bg-stage-950 border border-stage-700 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-gold-500 font-medium text-xs sm:text-xs">
                        <option value="title-asc">Title (A &rarr; Z)</option>
                        <option value="title-desc">Title (Z &rarr; A)</option>
                        <option value="artist-asc">Artist (A &rarr; Z)</option>
                        <option value="artist-desc">Artist (Z &rarr; A)</option>
                        <option value="num-asc">Song # (00001 &rarr; 99999)</option>
                        <option value="num-desc">Song # (99999 &rarr; 00001)</option>
                    </select>
                </div>

                <!-- View Mode Buttons -->
                <div class="flex items-center space-x-1 bg-stage-950 p-1 rounded-lg border border-stage-700">
                    <button onclick="setViewMode('grid')" id="view-btn-grid" title="Grid Cards" class="p-1.5 rounded-md text-gold-400 bg-stage-800 transition">
                        <i class="fa-solid fa-border-all text-sm w-5 h-5 flex items-center justify-center"></i>
                    </button>
                    <button onclick="setViewMode('list')" id="view-btn-list" title="Compact Table List" class="p-1.5 rounded-md text-slate-400 hover:text-slate-200 transition">
                        <i class="fa-solid fa-list-ul text-sm w-5 h-5 flex items-center justify-center"></i>
                    </button>
                    <button onclick="setViewMode('binder')" id="view-btn-binder" title="Vintage Vinyl Binder" class="p-1.5 rounded-md text-slate-400 hover:text-slate-200 transition">
                        <i class="fa-solid fa-book-open text-sm w-5 h-5 flex items-center justify-center"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Alphabet Bar -->
        <div class="no-print bg-stage-900/60 rounded-xl border border-stage-700/60 p-2 overflow-x-auto no-scrollbar">
            <div id="alphabetBar" class="flex items-center gap-1 min-w-max text-xs font-semibold font-mono">
                <!-- Dynamically populated via JavaScript -->
            </div>
        </div>

        <!-- Songs Grid / List Container -->
        <div id="songsContainer" class="min-h-[350px]">
            <!-- Dynamic Song Cards / Rows / Binder View inserted here -->
        </div>

        <!-- Infinite scroll status -->
        <div id="paginationBar" class="no-print flex items-center justify-between gap-3 pt-4 border-t border-stage-800 text-xs sm:text-sm text-slate-400">
            <span id="pageStatsText" class="font-mono">Showing 0 of 0</span>
            <span id="scrollHint" class="font-mono text-slate-500"></span>
        </div>

    </main>

    <div id="uploadModal" class="no-print fixed inset-0 bg-stage-950/80 backdrop-blur-md z-50 hidden items-center justify-center p-3 sm:p-4 transition-all duration-200 overflow-y-auto">
        <div class="bg-stage-900 border border-stage-700 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl relative space-y-4 sm:space-y-5 gold-border-glow max-h-[90vh] overflow-y-auto my-auto">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="space-y-1">
                <h3 class="text-xl font-serif font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-arrow-up text-gold-400"></i>
                    <span>Upload Songbook CSV</span>
                </h3>
                <p class="text-xs text-slate-400">Choose a file or paste CSV text directly (ideal for mobile/iOS).</p>
            </div>

            <!-- Upload Mode Switcher Tabs -->
            <div class="flex rounded-xl bg-stage-950 p-1 border border-stage-800 text-xs font-semibold">
                <button id="tabBtnFile" onclick="switchUploadTab('file')" class="flex-1 py-2 rounded-lg bg-gold-500 text-slate-950 font-bold transition">Choose File</button>
                <button id="tabBtnPaste" onclick="switchUploadTab('paste')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition">Paste CSV Text</button>
            </div>

            <!-- File Upload Tab Content -->
            <div id="uploadTabFile" class="space-y-3">
                <div id="dragDropArea" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropFile(event)" class="relative border-2 border-dashed border-stage-700 hover:border-gold-500 bg-stage-950/70 rounded-xl p-6 sm:p-8 text-center cursor-pointer transition-all duration-200 group overflow-hidden">
                    <label for="csvFileInput" class="cursor-pointer block w-full h-full">
                        <input type="file" id="csvFileInput" accept=".csv,.txt,.tsv,text/*,application/csv,application/vnd.ms-excel" onchange="handleFileSelect(event)" class="sr-only">
                        <div class="space-y-3 pointer-events-none">
                            <div id="uploadIconContainer" class="w-14 h-14 bg-stage-800 rounded-full flex items-center justify-center mx-auto text-gold-400 group-hover:scale-110 transition">
                                <i id="uploadIcon" class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                            </div>
                            <div>
                                <p id="uploadMainText" class="text-sm font-semibold text-slate-200">Tap here to select CSV file</p>
                                <p id="uploadSubText" class="text-xs text-slate-500 mt-1 font-mono">Supports Files app, iCloud Drive & local CSVs</p>
                            </div>
                            <span class="inline-block px-3 py-1.5 bg-stage-800 border border-stage-700 text-gold-400 text-xs font-bold rounded-lg mt-1">Browse Files</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Paste Raw CSV Text Tab Content -->
            <div id="uploadTabPaste" class="hidden space-y-3">
                <textarea id="pasteCsvInput" placeholder="Paste your CSV text here...&#10;e.g.&#10;No,Title,Artist&#10;1,Bohemian Rhapsody,Queen&#10;45,Rolling in the Deep,Adele" class="w-full h-36 bg-stage-950 border border-stage-700 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-gold-500 resize-none"></textarea>
                <button onclick="processPastedCSV()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-600 via-gold-600 to-gold-500 text-slate-950 font-bold text-xs shadow-lg hover:from-amber-500 hover:to-gold-400 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-file-import"></i>
                    <span>Load Pasted Songs</span>
                </button>
            </div>

            <div class="flex items-center justify-between pt-3 border-t border-stage-800">
                <button onclick="downloadSampleCSV()" class="text-xs text-gold-400 hover:text-gold-300 font-semibold flex items-center space-x-1.5 underline">
                    <i class="fa-solid fa-download"></i>
                    <span>Download Sample Template CSV</span>
                </button>
                <button onclick="closeUploadModal()" class="px-4 py-2 bg-stage-800 hover:bg-stage-700 text-slate-300 text-xs font-semibold rounded-lg">Cancel</button>
            </div>
        </div>
    </div>

    <div id="songDetailModal" class="no-print fixed inset-0 bg-stage-950/85 backdrop-blur-md z-50 hidden items-center justify-center p-3 sm:p-4 overflow-y-auto">
        <div class="bg-stage-900 border border-stage-700 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl relative space-y-4 sm:space-y-5 gold-border-glow overflow-hidden max-h-[90vh] overflow-y-auto my-auto">
            <!-- Background Record Accent -->
            <div class="absolute -right-10 -top-10 opacity-10 pointer-events-none text-gold-400">
                <i class="fa-solid fa-record-vinyl text-[160px]"></i>
            </div>

            <button onclick="closeSongModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- Song Info Card Header -->
            <div class="flex items-start gap-3 sm:gap-4 pr-6">
                <div class="bg-gradient-to-br from-gold-300 via-gold-500 to-amber-700 text-slate-950 font-mono font-bold text-lg sm:text-2xl px-3 py-2.5 sm:px-3.5 sm:py-3 rounded-xl shadow-lg border border-gold-300 min-w-[80px] sm:min-w-[90px] text-center">
                    <span id="modalSongNum">00001</span>
                </div>
                <div class="flex-grow min-w-0">
                    <h2 id="modalSongTitle" class="text-lg sm:text-xl font-bold text-white leading-tight truncate">Song Title</h2>
                    <p id="modalSongArtist" class="text-xs sm:text-sm font-semibold text-gold-400 mt-1 truncate">Artist Name</p>
                </div>
            </div>

            <!-- Pitch Reference Synthesizer (Web Audio API) -->
            <div class="bg-stage-950/90 rounded-xl p-3 sm:p-4 border border-stage-700/80 space-y-2">
                <div class="flex items-center justify-between text-[11px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <span><i class="fa-solid fa-tuning-fork text-gold-400 mr-1.5"></i>Pitch Pipe Helper</span>
                    <span class="text-gold-500 text-[10px] font-mono">Synth Pitch</span>

                <div class="grid grid-cols-7 gap-1 pt-1 font-mono">
                    <button onclick="playPitchNote(261.63, 'C')" class="bg-stage-800 hover:bg-gold-500 hover:text-slate-950 py-2 rounded text-xs font-bold text-slate-200 border border-stage-700 transition">C</button>
                    <button onclick="playPitchNote(293.66, 'D')" class="bg-stage-800 hover:bg-gold-500 hover:text-slate-950 py-2 rounded text-xs font-bold text-slate-200 border border-stage-700 transition">D</button>
                    <button onclick="playPitchNote(329.63, 'E')" class="bg-stage-800 hover:bg-gold-500 hover:text-slate-950 py-2 rounded text-xs font-bold text-slate-200 border border-stage-700 transition">E</button>
                    <button onclick="playPitchNote(349.23, 'F')" class="bg-stage-800 hover:bg-gold-500 hover:text-slate-950 py-2 rounded text-xs font-bold text-slate-200 border border-stage-700 transition">F</button>
                    <button onclick="playPitchNote(392.00, 'G')" class="bg-stage-800 hover:bg-gold-500 hover:text-slate-950 py-2 rounded text-xs font-bold text-slate-200 border border-stage-700 transition">G</button>
                    <button onclick="playPitchNote(440.00, 'A')" class="bg-stage-800 hover:bg-gold-500 hover:text-slate-950 py-2 rounded text-xs font-bold text-slate-200 border border-stage-700 transition">A</button>
                    <button onclick="playPitchNote(493.88, 'B')" class="bg-stage-800 hover:bg-gold-500 hover:text-slate-950 py-2 rounded text-xs font-bold text-slate-200 border border-stage-700 transition">B</button>
                </div>
            </div>

            <!-- Singer Request Notes Pad -->
            <div class="space-y-1.5">
                <label for="modalSongNotes" class="text-xs font-semibold text-slate-400 flex items-center justify-between">
                    <span>Singer Key / Performance Notes:</span>
                    <span class="text-[10px] text-slate-500">Auto-saved</span>
                </label>
                <textarea id="modalSongNotes" oninput="saveSongNotes()" placeholder="e.g. Sung in Key of G, duet with Sarah..." class="w-full bg-stage-950 border border-stage-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-gold-500 h-20 resize-none font-sans"></textarea>
            </div>

            <!-- Modal Action Buttons -->
            <div class="flex flex-col xs:flex-row sm:flex-row items-center justify-between gap-2.5 sm:gap-3 pt-2">
                <button id="modalFavToggleBtn" onclick="toggleModalFav()" class="w-full sm:w-1/2 py-2.5 px-4 rounded-xl bg-stage-800 hover:bg-stage-700 text-slate-200 font-semibold text-xs flex items-center justify-center space-x-2 border border-stage-700 transition">
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <span id="modalFavText">Favorite</span>
                </button>

                <button onclick="copySongCode()" class="w-full sm:w-1/2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-amber-600 via-gold-600 to-gold-500 hover:from-amber-500 hover:to-gold-400 text-slate-950 font-bold text-xs flex items-center justify-center space-x-2 shadow-lg transition">
                    <i class="fa-solid fa-copy"></i>
                    <span>Copy Song Code</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <button id="backToTopBtn" onclick="scrollToTop()" title="Back to top" class="no-print hidden fixed z-40 w-11 h-11 rounded-full bg-gold-500 hover:bg-gold-400 text-slate-950 shadow-xl flex items-center justify-center transition" style="left:calc(1.25rem + env(safe-area-inset-left, 0px)); bottom:calc(1.25rem + env(safe-area-inset-bottom, 0px));">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <script>
        // Register service worker for offline use / installability
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
            });
        }
        // Core Application State
        let songbookSongs = [];
        let filteredSongs = [];
        let favoriteIds = new Set();
        let songNotesMap = {};

        // Helper function to handle iOS / browser storage quota limits safely
        function safeSetLocalStorage(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.warn(`Browser storage limit reached for key "${key}":`, e);
                return false;
            }
        }

        try {
            favoriteIds = new Set(JSON.parse(localStorage.getItem('songbook_fav_ids') || '[]'));
        } catch(e) {
            favoriteIds = new Set();
        }

        try {
            songNotesMap = JSON.parse(localStorage.getItem('songbook_notes') || '{}');
        } catch(e) {
            songNotesMap = {};
        }
        
        let currentSearchQuery = '';
        let currentScope = 'all'; // 'all', 'title', 'artist', 'number'
        let currentLetter = 'ALL';
        const DEFAULT_SORT = 'title-asc';
        let currentSort = DEFAULT_SORT;
        // Shared collator: much faster than localeCompare when sorting ~48k songs
        const sortCollator = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });
        const DEFAULT_VIEW = 'list';
        let viewMode = DEFAULT_VIEW; // 'grid', 'list', 'binder'
        let showFavsOnly = false;
        
        // Infinite scroll: songs are rendered in batches as the user scrolls
        const BATCH_SIZE = 60;
        let visibleCount = BATCH_SIZE;
        let scrollObserver = null;
        let activeSongObj = null;

        // Web Audio Synthesizer Context
        let audioContext = null;

        // Default song list lives in songs.csv (columns: No, Title, Artist). Edit that file to change the defaults.
        const DEFAULT_SONGS_URL = 'songs.csv';
        const SONGS_STORAGE_KEY = 'songbook_songs_data_v2';

        /**
         * Formats any song number string/number to 5 digits padding.
         * e.g., '1' -> '00001', '452' -> '00452', '12345' -> '12345'
         */
        function format5DigitNumber(val) {
            if (val === undefined || val === null) return '00000';
            const cleanStr = String(val).trim();
            const parsedInt = parseInt(cleanStr, 10);
            
            if (!isNaN(parsedInt)) {
                return String(parsedInt).padStart(5, '0');
            }
            return cleanStr.padStart(5, '0');
        }

        // Reads state variables directly from URL Query Parameters
        function readStateFromUrl() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('q')) currentSearchQuery = params.get('q');
            if (params.has('scope')) currentScope = params.get('scope');
            if (params.has('letter')) currentLetter = params.get('letter');
            if (params.has('sort')) currentSort = params.get('sort');
            if (params.has('view')) viewMode = params.get('view');
            if (params.has('favs')) showFavsOnly = params.get('favs') === '1';
        }

        // Synchronizes current active state to URL query string
        function updateUrlParams() {
            const params = new URLSearchParams();
            if (currentSearchQuery) params.set('q', currentSearchQuery);
            if (currentScope !== 'all') params.set('scope', currentScope);
            if (currentLetter !== 'ALL') params.set('letter', currentLetter);
            if (currentSort !== DEFAULT_SORT) params.set('sort', currentSort);
            if (viewMode !== DEFAULT_VIEW) params.set('view', viewMode);
            if (showFavsOnly) params.set('favs', '1');

            const newQuery = params.toString();
            const newUrl = newQuery ? `${window.location.pathname}?${newQuery}` : window.location.pathname;
            if (window.location.search !== (newQuery ? `?${newQuery}` : '')) {
                window.history.replaceState({}, '', newUrl);
            }
        }

        function syncUIWithState() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.value = currentSearchQuery;
                document.getElementById('clearSearchBtn').classList.toggle('hidden', currentSearchQuery === '');
            }
            const sortSelect = document.getElementById('sortOption');
            if (sortSelect) sortSelect.value = currentSort;

            setSearchScope(currentScope, false);
            setLetterFilter(currentLetter, false);
            setViewMode(viewMode, false);
            updateFavsBtnUI();
        }

        window.addEventListener('DOMContentLoaded', () => {
            readStateFromUrl();
            renderAlphabetBar();
            syncUIWithState();
            loadStoredOrDemoSongs();
            updateFavsBadgeCount();

            const csvInput = document.getElementById('csvFileInput');
            if (csvInput) {
                csvInput.addEventListener('change', handleFileSelect);
                csvInput.addEventListener('input', handleFileSelect);
            }

            window.addEventListener('popstate', () => {
                readStateFromUrl();
                syncUIWithState();
                applyFiltersAndRender();
            });

            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
            });
        });

        // Minimal RFC-4180 CSV parser (handles quotes, commas/newlines in fields, BOM, CRLF)
        function parseCsvText(text) {
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const rows = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
                    } else { field += c; }
                } else if (c === '"') { inQuotes = true; }
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    row.push(field); field = '';
                    if (row.length > 1 || row[0] !== '') rows.push(row);
                    row = [];
                } else { field += c; }
            }
            if (field !== '' || row.length) { row.push(field); if (row.length > 1 || row[0] !== '') rows.push(row); }
            return rows;
        }

        async function fetchDefaultSongs() {
            const res = await fetch(DEFAULT_SONGS_URL, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const rows = parseCsvText(await res.text());
            if (!rows.length) return [];
            const header = rows[0].map(h => h.trim().toLowerCase());
            const find = (names, fallback) => {
                const i = header.findIndex(h => names.includes(h));
                return i >= 0 ? i : fallback;
            };
            const hasHeader = header.some(h => ['no', 'number', 'title', 'artist'].includes(h));
            const iNo = hasHeader ? find(['no', 'number', 'song #', 'code'], 0) : 0;
            const iTitle = hasHeader ? find(['title', 'song', 'name'], 1) : 1;
            const iArtist = hasHeader ? find(['artist', 'singer'], 2) : 2;
            return rows.slice(hasHeader ? 1 : 0).map(r => ({ no: r[iNo], title: r[iTitle], artist: r[iArtist] }));
        }

        async function loadStoredOrDemoSongs() {
            try {
                const saved = localStorage.getItem(SONGS_STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        songbookSongs = processRawSongArray(parsed);
                        document.getElementById('sourceBadge').innerText = "Loaded Saved Songs";
                        document.getElementById('sourceBadge').className = "text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-0.5 rounded-full font-semibold";
                        applyFiltersAndRender();
                        return;
                    }
                }
            } catch(e) {
                console.error("Error reading stored songs", e);
            }
            await restoreDefaultDemoSongs(false);
        }

        async function restoreDefaultDemoSongs(notify = true) {
            const badge = document.getElementById('sourceBadge');
            badge.innerText = "Loading songs…";
            try {
                songbookSongs = processRawSongArray(await fetchDefaultSongs());
            } catch (e) {
                console.error("Could not load " + DEFAULT_SONGS_URL, e);
                songbookSongs = [];
                badge.innerText = "Song list unavailable";
                badge.className = "text-xs bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2.5 py-0.5 rounded-full font-semibold";
                applyFiltersAndRender();
                showToast("Couldn't load songs.csv. Check your connection and reload.", "error");
                return;
            }
            try { localStorage.removeItem(SONGS_STORAGE_KEY); } catch (e) {}
            document.getElementById('catalogTitle').innerText = "SongHub Songbook";
            badge.innerText = "Default Songs Loaded";
            badge.className = "text-xs bg-gold-500/20 text-gold-400 border border-gold-500/30 px-2.5 py-0.5 rounded-full font-semibold";
            applyFiltersAndRender();
            if (notify) {
                showToast("Restored default SongHub songbook!", "success");
            }
        }

        function processRawSongArray(rawList) {
            return rawList.map((item, index) => {
                const rawNo = String(item.no || index + 1).trim();
                const intNo = parseInt(rawNo, 10) || 0;
                const formatted5Digit = format5DigitNumber(rawNo);

                return {
                    id: formatted5Digit,
                    rawNo: rawNo,
                    intNo: intNo,
                    title: String(item.title || 'Untitled').trim(),
                    artist: String(item.artist || 'Unknown Artist').trim()
                };
            });
        }

        function renderAlphabetBar() {
            const letters = ['ALL', '#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
            const container = document.getElementById('alphabetBar');
            container.innerHTML = letters.map(let => `
                <button onclick="setLetterFilter('${let}')" id="let-${let}" class="px-2.5 py-1.5 min-w-[32px] h-8 rounded-md flex items-center justify-center ${let === 'ALL' ? 'bg-gold-500 text-slate-950 font-bold' : 'bg-stage-950 text-slate-400 hover:text-white hover:bg-stage-800'} transition flex-shrink-0">
                    ${let}
                </button>
            `).join('');
        }

        function handleSearchChange() {
            const input = document.getElementById('searchInput');
            currentSearchQuery = input.value.trim().toLowerCase();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', currentSearchQuery === '');
            visibleCount = BATCH_SIZE;
            applyFiltersAndRender();
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            visibleCount = BATCH_SIZE;
            applyFiltersAndRender();
        }

        function setSearchScope(scope, triggerRender = true) {
            currentScope = scope;
            document.querySelectorAll('.scope-btn').forEach(b => {
                b.className = "scope-btn px-3 py-2 rounded-lg bg-stage-950 text-slate-300 hover:bg-stage-800 border border-stage-700 transition flex-shrink-0";
            });
            const activeBtn = document.getElementById(`scope-${scope}`);
            if (activeBtn) {
                activeBtn.className = "scope-btn px-3 py-2 rounded-lg bg-gold-500 text-slate-950 font-bold transition shadow-sm flex-shrink-0";
            }
            if (triggerRender) {
                visibleCount = BATCH_SIZE;
                applyFiltersAndRender();
            }
        }

        function setLetterFilter(letter, triggerRender = true) {
            currentLetter = letter;
            const letters = ['ALL', '#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
            letters.forEach(let => {
                const b = document.getElementById(`let-${let}`);
                if (b) {
                    if (let === letter) {
                        b.className = "px-2.5 py-1.5 min-w-[32px] h-8 rounded-md flex items-center justify-center bg-gold-500 text-slate-950 font-bold transition flex-shrink-0";
                    } else {
                        b.className = "px-2.5 py-1.5 min-w-[32px] h-8 rounded-md flex items-center justify-center bg-stage-950 text-slate-400 hover:text-white hover:bg-stage-800 transition flex-shrink-0";
                    }
                }
            });
            if (triggerRender) {
                visibleCount = BATCH_SIZE;
                applyFiltersAndRender();
            }
        }

        function handleSortChange() {
            currentSort = document.getElementById('sortOption').value;
            applyFiltersAndRender();
        }

        function toggleFavoritesOnly() {
            showFavsOnly = !showFavsOnly;
            updateFavsBtnUI();
            visibleCount = BATCH_SIZE;
            applyFiltersAndRender();
        }

        function updateFavsBtnUI() {
            const btn = document.getElementById('favsToggleBtn');
            if (!btn) return;
            if (showFavsOnly) {
                btn.classList.add('bg-amber-500/20', 'border-amber-500/50', 'text-amber-400');
            } else {
                btn.classList.remove('bg-amber-500/20', 'border-amber-500/50', 'text-amber-400');
            }
        }

        function applyFiltersAndRender() {
            const q = currentSearchQuery;
            const qAsInt = parseInt(q, 10);
            const isQueryNumeric = !isNaN(qAsInt) && /^\d+$/.test(q);

            filteredSongs = songbookSongs.filter(song => {
                let matchesSearch = true;
                if (q) {
                    const numMatch = song.id.includes(q) || 
                                     song.rawNo.toLowerCase().includes(q) || 
                                     (isQueryNumeric && song.intNo === qAsInt);

                    const titleMatch = song.title.toLowerCase().includes(q);
                    const artistMatch = song.artist.toLowerCase().includes(q);

                    if (currentScope === 'title') {
                        matchesSearch = titleMatch;
                    } else if (currentScope === 'artist') {
                        matchesSearch = artistMatch;
                    } else if (currentScope === 'number') {
                        matchesSearch = numMatch;
                    } else {
                        matchesSearch = titleMatch || artistMatch || numMatch;
                    }
                }

                let matchesLetter = true;
                if (currentLetter !== 'ALL') {
                    const first = song.title.trim().charAt(0).toUpperCase();
                    if (currentLetter === '#') {
                        matchesLetter = !/[A-Z]/.test(first);
                    } else {
                        matchesLetter = first === currentLetter;
                    }
                }

                let matchesFavs = true;
                if (showFavsOnly) {
                    matchesFavs = favoriteIds.has(song.id);
                }

                return matchesSearch && matchesLetter && matchesFavs;
            });

            filteredSongs.sort((a, b) => {
                switch (currentSort) {
                    case 'num-asc':
                        return a.intNo - b.intNo || a.id.localeCompare(b.id);
                    case 'num-desc':
                        return b.intNo - a.intNo || b.id.localeCompare(a.id);
                    case 'title-asc':
                        return sortCollator.compare(a.title, b.title);
                    case 'title-desc':
                        return sortCollator.compare(b.title, a.title);
                    case 'artist-asc':
                        return sortCollator.compare(a.artist, b.artist);
                    case 'artist-desc':
                        return sortCollator.compare(b.artist, a.artist);
                    default:
                        return 0;
                }
            });

            document.getElementById('statTotalSongs').innerText = songbookSongs.length;
            document.getElementById('statFilteredSongs').innerText = filteredSongs.length;

            renderSongsDisplay();
        }

        function setViewMode(mode, triggerRender = true) {
            viewMode = mode;
            ['grid', 'list', 'binder'].forEach(m => {
                const btn = document.getElementById(`view-btn-${m}`);
                if (btn) {
                    if (m === mode) {
                        btn.className = "p-1.5 rounded-md text-gold-400 bg-stage-800 transition";
                    } else {
                        btn.className = "p-1.5 rounded-md text-slate-400 hover:text-slate-200 transition";
                    }
                }
            });
            if (triggerRender) {
                renderSongsDisplay();
            }
        }

        function renderSongsDisplay() {
            updateUrlParams();
            const container = document.getElementById('songsContainer');

            if (filteredSongs.length === 0) {
                container.innerHTML = `
                    <div class="bg-stage-900/40 border border-stage-700/60 rounded-2xl p-12 text-center space-y-3">
                        <div class="w-16 h-16 bg-stage-800 text-gold-400 rounded-full flex items-center justify-center mx-auto">
                            <i class="fa-solid fa-compact-disc text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-200">No matching songs found</h3>
                        <p class="text-xs text-slate-400 max-w-sm mx-auto">Try typing an exact song number like <b>00001</b> or <b>1</b>, or reset your active filters.</p>
                        <button onclick="resetAllFilters()" class="mt-2 px-4 py-2 bg-stage-800 hover:bg-stage-700 text-gold-400 font-semibold text-xs rounded-xl border border-stage-700 transition">Reset All Filters</button>
                    </div>
                `;
                renderedCount = 0;
                updateScrollStatus();
                return;
            }

            const wrapperClass = viewMode === 'grid'
                ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4'
                : viewMode === 'binder'
                    ? 'grid grid-cols-1 md:grid-cols-2 gap-4'
                    : 'bg-stage-900/90 border border-stage-700 rounded-2xl overflow-hidden divide-y divide-stage-800 shadow-xl';

            if (visibleCount > filteredSongs.length) visibleCount = filteredSongs.length;
            container.innerHTML = `<div id="songsList" class="${wrapperClass}">${songsToHtml(0, visibleCount)}</div><div id="scrollSentinel" class="h-px"></div>`;
            renderedCount = visibleCount;

            setupInfiniteScroll();
            updateScrollStatus();
        }

        let renderedCount = 0;

        function songItemHtml(song) {
            if (viewMode === 'grid') return renderGridCardHtml(song);
            if (viewMode === 'binder') return renderBinderCardHtml(song);
            return renderListItemHtml(song);
        }

        function songsToHtml(from, to) {
            let html = '';
            for (let i = from; i < to; i++) html += songItemHtml(filteredSongs[i]);
            return html;
        }

        function loadMoreSongs() {
            const list = document.getElementById('songsList');
            if (!list || renderedCount >= filteredSongs.length) return;
            const next = Math.min(renderedCount + BATCH_SIZE, filteredSongs.length);
            list.insertAdjacentHTML('beforeend', songsToHtml(renderedCount, next));
            renderedCount = next;
            visibleCount = next;
            updateScrollStatus();
            // If the sentinel is still on screen (tall viewport), keep filling
            const sentinel = document.getElementById('scrollSentinel');
            if (sentinel && renderedCount < filteredSongs.length) {
                const r = sentinel.getBoundingClientRect();
                if (r.top < window.innerHeight + 600) requestAnimationFrame(loadMoreSongs);
            }
        }

        function setupInfiniteScroll() {
            if (scrollObserver) scrollObserver.disconnect();
            const sentinel = document.getElementById('scrollSentinel');
            if (!sentinel) return;
            if (!('IntersectionObserver' in window)) { // fallback: load everything gradually via scroll
                window.onscroll = () => {
                    if (window.innerHeight + window.scrollY > document.body.offsetHeight - 800) loadMoreSongs();
                };
                return;
            }
            scrollObserver = new IntersectionObserver(entries => {
                if (entries.some(e => e.isIntersecting)) loadMoreSongs();
            }, { rootMargin: '800px 0px' });
            scrollObserver.observe(sentinel);
        }

        function updateScrollStatus() {
            const total = filteredSongs.length;
            const statsText = document.getElementById('pageStatsText');
            const hint = document.getElementById('scrollHint');
            if (statsText) statsText.innerText = total === 0 ? 'Showing 0 of 0' : `Showing ${renderedCount.toLocaleString()} of ${total.toLocaleString()}`;
            if (hint) hint.innerText = total > 0 && renderedCount >= total ? 'End of list' : (total > 0 ? 'Scroll for more' : '');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTopBtn');
            if (btn) btn.classList.toggle('hidden', window.scrollY < 600);
        }, { passive: true });

        function renderGridCardHtml(song) {
            const isFav = favoriteIds.has(song.id);
            return `
                <div onclick="openSongDetailModal('${song.id}')" class="song-card-print bg-stage-900/90 hover:bg-stage-800/90 border border-stage-700 hover:border-gold-500/60 rounded-xl p-3.5 sm:p-4 transition-all duration-200 cursor-pointer flex items-center space-x-3 sm:space-x-3.5 group relative shadow-md gold-border-glow">
                    <div class="bg-gradient-to-br from-gold-300 via-gold-500 to-amber-700 text-slate-950 font-mono font-bold text-base sm:text-lg px-2.5 py-2 rounded-lg flex items-center justify-center min-w-[68px] sm:min-w-[70px] shadow-sm group-hover:scale-105 transition flex-shrink-0">
                        ${song.id}
                    </div>
                    <div class="flex-grow min-w-0 pr-6">
                        <h4 class="text-xs sm:text-sm font-bold text-slate-100 truncate group-hover:text-gold-300 transition">${escapeHtml(song.title)}</h4>
                        <p class="text-[11px] sm:text-xs text-slate-400 truncate mt-0.5">${escapeHtml(song.artist)}</p>
                    </div>
                    <button onclick="event.stopPropagation(); toggleFavoriteId('${song.id}')" class="no-print absolute top-2.5 right-2.5 p-2 text-slate-600 hover:text-amber-400 transition" title="Toggle Favorite">
                        <i class="fa-solid fa-star text-sm ${isFav ? 'text-amber-400' : 'text-slate-600'}"></i>
                    </button>
                </div>
            `;
        }

        function renderListItemHtml(song) {
            const isFav = favoriteIds.has(song.id);
            return `
                <div onclick="openSongDetailModal('${song.id}')" class="song-card-print px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between hover:bg-stage-800/60 cursor-pointer transition group">
                    <div class="flex items-center space-x-3 sm:space-x-4 min-w-0">
                        <span class="font-mono font-bold text-gold-400 text-xs sm:text-sm bg-stage-950 border border-stage-700 px-2.5 sm:px-3 py-1 rounded-md min-w-[68px] sm:min-w-[75px] text-center flex-shrink-0">${song.id}</span>
                        <div class="min-w-0">
                            <span class="text-xs sm:text-sm font-semibold text-slate-100 group-hover:text-gold-300 transition truncate block">${escapeHtml(song.title)}</span>
                            <span class="text-[11px] sm:text-xs text-slate-400 truncate block">${escapeHtml(song.artist)}</span>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); toggleFavoriteId('${song.id}')" class="no-print p-2 text-slate-600 hover:text-amber-400 transition" title="Toggle Favorite">
                        <i class="fa-solid fa-star text-sm ${isFav ? 'text-amber-400' : 'text-slate-600'}"></i>
                    </button>
                </div>
            `;
        }

        function renderBinderCardHtml(song) {
            const isFav = favoriteIds.has(song.id);
            return `
                <div onclick="openSongDetailModal('${song.id}')" class="song-card-print bg-gradient-to-r from-stage-900 to-stage-800 border-l-4 border-l-gold-500 border border-stage-700 rounded-r-xl p-3.5 sm:p-4 cursor-pointer hover:bg-stage-800/80 transition flex items-center justify-between group">
                    <div class="flex items-center space-x-3 sm:space-x-4 min-w-0">
                        <div class="text-center min-w-[65px] sm:min-w-[70px] flex-shrink-0">
                            <span class="block text-[8px] sm:text-[9px] uppercase font-mono tracking-wider text-slate-500 font-bold">SONG CODE</span>
                            <span class="text-base sm:text-lg font-mono font-bold text-gold-400">${song.id}</span>
                        </div>
                        <div class="min-w-0">
                            <h4 class="text-sm sm:text-base font-bold text-slate-100 group-hover:text-gold-300 transition truncate">${escapeHtml(song.title)}</h4>
                            <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5 truncate">${escapeHtml(song.artist)}</p>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation(); toggleFavoriteId('${song.id}')" class="no-print p-2 text-slate-600 hover:text-amber-400 transition" title="Toggle Favorite">
                        <i class="fa-solid fa-star text-sm sm:text-base ${isFav ? 'text-amber-400' : 'text-slate-600'}"></i>
                    </button>
                </div>
            `;
        }

        function openSongDetailModal(songId) {
            const song = songbookSongs.find(s => s.id === songId);
            if (!song) return;

            activeSongObj = song;
            document.getElementById('modalSongNum').innerText = song.id;
            document.getElementById('modalSongTitle').innerText = song.title;
            document.getElementById('modalSongArtist').innerText = song.artist;
            
            document.getElementById('modalSongNotes').value = songNotesMap[song.id] || '';

            updateModalFavState();

            const modal = document.getElementById('songDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeSongModal() {
            const modal = document.getElementById('songDetailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            activeSongObj = null;
        }

        function saveSongNotes() {
            if (!activeSongObj) return;
            const val = document.getElementById('modalSongNotes').value;
            if (val.trim()) {
                songNotesMap[activeSongObj.id] = val;
            } else {
                delete songNotesMap[activeSongObj.id];
            }
            safeSetLocalStorage('songbook_notes', JSON.stringify(songNotesMap));
        }

        function toggleFavoriteId(songId) {
            if (favoriteIds.has(songId)) {
                favoriteIds.delete(songId);
                showToast(`Removed #${songId} from favorites.`, "info");
            } else {
                favoriteIds.add(songId);
                showToast(`Added #${songId} to favorites!`, "success");
            }
            safeSetLocalStorage('songbook_fav_ids', JSON.stringify([...favoriteIds]));
            updateFavsBadgeCount();
            applyFiltersAndRender();
        }

        function updateFavsBadgeCount() {
            document.getElementById('favsCountBadge').innerText = favoriteIds.size;
        }

        function copySongCode() {
            if (!activeSongObj) return;
            const textToCopy = `${activeSongObj.id} - ${activeSongObj.title} (${activeSongObj.artist})`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy);
            } else {
                const textarea = document.createElement("textarea");
                document.body.appendChild(textarea);
                textarea.value = textToCopy;
                textarea.select();
                document.execCommand("copy");
                document.body.removeChild(textarea);
            }
            showToast(`Copied "${textToCopy}" to clipboard!`, "success");
        }

        function playPitchNote(freq, noteLabel) {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioContext.currentTime);

                gain.gain.setValueAtTime(0.25, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.start();
                osc.stop(audioContext.currentTime + 1.2);

                showToast(`Playing Reference Pitch: Note ${noteLabel}`, "info");
            } catch (err) {
                console.error("Audio synth error", err);
            }
        }

        function openUploadModal() {
            resetUploadUI();
            const modal = document.getElementById('uploadModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeUploadModal() {
            const modal = document.getElementById('uploadModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            resetUploadUI();
        }

        function switchUploadTab(tab) {
            const fileTab = document.getElementById('uploadTabFile');
            const pasteTab = document.getElementById('uploadTabPaste');
            const btnFile = document.getElementById('tabBtnFile');
            const btnPaste = document.getElementById('tabBtnPaste');

            if (tab === 'paste') {
                fileTab.classList.add('hidden');
                pasteTab.classList.remove('hidden');
                btnFile.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition";
                btnPaste.className = "flex-1 py-2 rounded-lg bg-gold-500 text-slate-950 font-bold transition";
            } else {
                pasteTab.classList.add('hidden');
                fileTab.classList.remove('hidden');
                btnPaste.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-slate-200 transition";
                btnFile.className = "flex-1 py-2 rounded-lg bg-gold-500 text-slate-950 font-bold transition";
            }
        }

        function resetUploadUI() {
            const dropArea = document.getElementById('dragDropArea');
            if (dropArea) {
                dropArea.classList.remove('border-gold-500', 'bg-stage-900');
            }
            const inputEl = document.getElementById('csvFileInput');
            if (inputEl) inputEl.value = '';
            
            const pasteEl = document.getElementById('pasteCsvInput');
            if (pasteEl) pasteEl.value = '';

            document.getElementById('uploadMainText').innerText = "Tap here to select CSV file";
            document.getElementById('uploadSubText').innerText = "Supports Files app, iCloud Drive & local CSVs";
            document.getElementById('uploadIcon').className = "fa-solid fa-cloud-arrow-up text-2xl";
            document.getElementById('uploadIconContainer').className = "w-14 h-14 bg-stage-800 rounded-full flex items-center justify-center mx-auto text-gold-400 group-hover:scale-110 transition";
            switchUploadTab('file');
        }

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('dragDropArea').classList.add('border-gold-500', 'bg-stage-900');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            document.getElementById('dragDropArea').classList.remove('border-gold-500', 'bg-stage-900');
        }

        function handleDropFile(e) {
            e.preventDefault();
            handleDragLeave(e);
            if (e.dataTransfer && e.dataTransfer.files.length) {
                processCSVFile(e.dataTransfer.files[0]);
            }
        }

        function handleFileSelect(e) {
            const files = e.target ? e.target.files : null;
            if (files && files.length > 0) {
                processCSVFile(files[0]);
            }
        }

        function processCSVFile(file) {
            if (!file) {
                showToast("No file selected.", "error");
                return;
            }

            const fileName = file.name || "Selected File";

            // Visual upload feedback
            document.getElementById('uploadMainText').innerText = `Reading "${fileName}"...`;
            document.getElementById('uploadSubText').innerText = "Parsing contents...";
            document.getElementById('uploadIcon').className = "fa-solid fa-spinner animate-spin text-2xl text-gold-400";

            const applyParsedRows = (rawRows) => {
                if (!rawRows || rawRows.length === 0) {
                    showToast("Could not extract rows from file.", "error");
                    resetUploadUI();
                    return;
                }

                const parsedSongs = parseRowsToSongs(rawRows);

                if (parsedSongs.length === 0) {
                    showToast("No valid song records found.", "error");
                    resetUploadUI();
                    return;
                }

                songbookSongs = processRawSongArray(parsedSongs);
                const isSaved = safeSetLocalStorage(SONGS_STORAGE_KEY, JSON.stringify(parsedSongs));

                closeUploadModal();
                
                const displayTitle = fileName !== "Selected File" ? fileName.replace(/\.[^/.]+$/, '') : 'Custom Songbook';
                document.getElementById('catalogTitle').innerText = displayTitle;
                document.getElementById('sourceBadge').innerText = isSaved ? "Custom File Loaded" : "Session Mode";
                document.getElementById('sourceBadge').className = "text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-0.5 rounded-full font-semibold";

                applyFiltersAndRender();
                if (isSaved) {
                    showToast(`Loaded ${parsedSongs.length} songs from "${fileName}"!`, "success");
                } else {
                    showToast(`Loaded ${parsedSongs.length} songs for this session (browser storage quota full).`, "info");
                }
            };

            // PapaParse works natively directly on File objects on iOS Safari
            if (typeof Papa !== 'undefined' && Papa.parse) {
                Papa.parse(file, {
                    skipEmptyLines: 'greedy',
                    dynamicTyping: false,
                    complete: function(results) {
                        if (results && results.data && results.data.length > 0) {
                            applyParsedRows(results.data);
                        } else {
                            readViaFileReader(file, applyParsedRows);
                        }
                    },
                    error: function(err) {
                        console.warn("PapaParse file error, trying FileReader fallback:", err);
                        readViaFileReader(file, applyParsedRows);
                    }
                });
            } else {
                readViaFileReader(file, applyParsedRows);
            }
        }

        function readViaFileReader(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                let fileText = e.target.result;
                if (!fileText || !fileText.trim()) {
                    showToast("The selected file is empty.", "error");
                    resetUploadUI();
                    return;
                }
                fileText = fileText.replace(/^\uFEFF/, '');
                const rawRows = parseCSVTextTo2DArray(fileText);
                callback(rawRows);
            };
            reader.onerror = function(err) {
                console.error("FileReader error:", err);
                showToast("iOS File Access Error: Unable to read file.", "error");
                resetUploadUI();
            };
            try {
                reader.readAsText(file, 'UTF-8');
            } catch (err) {
                console.error("readAsText exception:", err);
                showToast("Error opening file: " + err.message, "error");
                resetUploadUI();
            }
        }

        function processPastedCSV() {
            const pasteInput = document.getElementById('pasteCsvInput');
            if (!pasteInput) return;
            const text = pasteInput.value;
            if (!text || !text.trim()) {
                showToast("Please paste CSV text first.", "error");
                return;
            }

            let rawRows = [];
            if (typeof Papa !== 'undefined' && Papa.parse) {
                const parsed = Papa.parse(text, { skipEmptyLines: 'greedy' });
                if (parsed && parsed.data) rawRows = parsed.data;
            }
            if (!rawRows || rawRows.length === 0) {
                rawRows = parseCSVTextTo2DArray(text);
            }

            const parsedSongs = parseRowsToSongs(rawRows);
            if (parsedSongs.length === 0) {
                showToast("No valid song data could be read from pasted text.", "error");
                return;
            }

            songbookSongs = processRawSongArray(parsedSongs);
            const isSaved = safeSetLocalStorage(SONGS_STORAGE_KEY, JSON.stringify(parsedSongs));

            closeUploadModal();
            document.getElementById('catalogTitle').innerText = "Pasted Songbook";
            document.getElementById('sourceBadge').innerText = isSaved ? "Custom File Loaded" : "Session Mode";
            document.getElementById('sourceBadge').className = "text-xs bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-0.5 rounded-full font-semibold";

            applyFiltersAndRender();
            if (isSaved) {
                showToast(`Loaded ${parsedSongs.length} songs from pasted text!`, "success");
            } else {
                showToast(`Loaded ${parsedSongs.length} songs for this session (browser storage quota full).`, "info");
            }
        }

        function parseCSVTextTo2DArray(text) {
            const lines = [];
            let currentRow = [];
            let currentVal = '';
            let inQuotes = false;

            // Auto-detect line 1 delimiter: comma, semicolon, tab, pipe
            const firstLineEnd = text.search(/\r\n|\n|\r/);
            const sampleLine = firstLineEnd !== -1 ? text.substring(0, firstLineEnd) : text;
            
            let delimiter = ',';
            if (sampleLine.includes(';') && !sampleLine.includes(',')) delimiter = ';';
            else if (sampleLine.includes('\t')) delimiter = '\t';
            else if (sampleLine.includes('|')) delimiter = '|';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentVal += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === delimiter && !inQuotes) {
                    currentRow.push(currentVal.trim());
                    currentVal = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                    currentRow.push(currentVal.trim());
                    if (currentRow.some(cell => cell.length > 0)) {
                        lines.push(currentRow);
                    }
                    currentRow = [];
                    currentVal = '';
                } else {
                    currentVal += char;
                }
            }
            if (currentVal || currentRow.length > 0) {
                currentRow.push(currentVal.trim());
                if (currentRow.some(cell => cell.length > 0)) {
                    lines.push(currentRow);
                }
            }
            return lines;
        }

        function parseRowsToSongs(rows) {
            const cleanRows = rows.filter(r => Array.isArray(r) && r.some(cell => String(cell).trim().length > 0));
            if (cleanRows.length === 0) return [];

            const firstRow = cleanRows[0].map(c => String(c !== undefined && c !== null ? c : '').trim());
            const lowerFirstRow = firstRow.map(c => c.toLowerCase());

            // Header key search patterns
            const noIdx = lowerFirstRow.findIndex(k => k.includes('no') || k.includes('num') || k.includes('#') || k.includes('code') || k.includes('id') || k.includes('track'));
            const titleIdx = lowerFirstRow.findIndex(k => k.includes('title') || k.includes('song') || k.includes('name') || k.includes('description'));
            const artistIdx = lowerFirstRow.findIndex(k => k.includes('artist') || k.includes('singer') || k.includes('band') || k.includes('performer') || k.includes('by'));

            const hasHeader = (noIdx !== -1 || titleIdx !== -1 || artistIdx !== -1);

            let startRowIndex = 0;
            let colNoIndex = 0;
            let colTitleIndex = 1;
            let colArtistIndex = 2;

            if (hasHeader) {
                startRowIndex = 1; // Skip header row
                colNoIndex = noIdx !== -1 ? noIdx : 0;
                colTitleIndex = titleIdx !== -1 ? titleIdx : (colNoIndex === 0 ? 1 : 0);
                colArtistIndex = artistIdx !== -1 ? artistIdx : (colNoIndex !== 2 && colTitleIndex !== 2 ? 2 : 1);
            }

            const songs = [];

            for (let i = startRowIndex; i < cleanRows.length; i++) {
                const row = cleanRows[i].map(c => String(c !== undefined && c !== null ? c : '').trim());
                if (row.length === 0) continue;

                let rawNo = row[colNoIndex] !== undefined ? row[colNoIndex] : '';
                let titleVal = row[colTitleIndex] !== undefined ? row[colTitleIndex] : '';
                let artistVal = row[colArtistIndex] !== undefined ? row[colArtistIndex] : '';

                // Fallbacks if columns are missing or shifted
                if (!titleVal && rawNo && !/^\d+$/.test(rawNo)) {
                    titleVal = rawNo;
                    rawNo = String(songs.length + 1);
                }

                if (!artistVal) artistVal = 'Unknown Artist';
                if (!titleVal) titleVal = 'Untitled Song';

                songs.push({
                    no: rawNo || String(songs.length + 1),
                    title: titleVal,
                    artist: artistVal
                });
            }

            return songs;
        }

        function downloadSampleCSV() {
            const csvText = "No,Title,Artist,PDF Page\n"
                + "1,Bohemian Rhapsody,Queen,1\n"
                + "45,Rolling in the Deep,Adele,5\n"
                + "452,Stairway to Heaven,Led Zeppelin,12\n"
                + "12345,Uptown Funk,Bruno Mars,30\n";

            const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'songbook_template.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("Sample CSV template downloaded!", "info");
        }

        function resetAllFilters() {
            clearSearchInput();
            setSearchScope('all', false);
            setLetterFilter('ALL', false);
            showFavsOnly = false;
            updateFavsBtnUI();
            visibleCount = BATCH_SIZE;
            applyFiltersAndRender();
        }

        function showToast(msg, type = "info") {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const bgClass = type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-300' 
                          : type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-300' 
                          : 'bg-stage-900/95 border-gold-500 text-gold-300';

            toast.className = `px-4 py-3 rounded-xl border ${bgClass} backdrop-blur-md shadow-xl text-xs sm:text-sm font-medium flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto max-w-sm`;
            toast.innerHTML = `
                <i class="fa-solid fa-circle-info text-base"></i>
                <span>${escapeHtml(msg)}</span>
            `;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 3000);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
